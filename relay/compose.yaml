# For Dokploy (or plain Docker Compose). Point the domain at port 8080 in Dokploy.
services:
  relay:
    build: .
    restart: always
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Distroless has no shell or curl: the binary is the only thing in the image.
      disable: true
    deploy:
      resources:
        limits:
          memory: 64M
