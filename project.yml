name: Maison

options:
  bundleIdPrefix: com.theodaguier
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Maison:
    type: application
    platform: iOS
    sources:
      - path: Maison
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theodaguier.maison
        INFOPLIST_KEY_CFBundleDisplayName: Maison
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pour trouver votre serveur Home Assistant automatiquement, sans saisir d’adresse.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Maison/Info.plist
      properties:
        NSBonjourServices:
          - _home-assistant._tcp
    scheme:
      testTargets:
        - MaisonTests
      gatherCoverageData: true

  MaisonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaisonTests
    dependencies:
      - target: Maison
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theodaguier.maison.tests
        GENERATE_INFOPLIST_FILE: YES
