name: Relay

# The relay's own tests, only when it changes.
on:
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
