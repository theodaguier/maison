name: TestFlight

# Publie une build sur TestFlight à chaque tag vX.Y.Z, ou à la main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::Secret $name manquant"; exit 1; }
          done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "::error::Secret ASC_KEY_P8 manquant"; exit 1; }

      - name: Clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Certificats intermédiaires Apple
        # Sans eux, codesign n'embarque pas la chaîne complète et App Store Connect
        # rejette la build (erreur 90035, « Invalid Signature »).
        run: |
          for ca in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6 DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/$ca.cer" || true
          done

      - name: XcodeGen
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Maison.xcodeproj \
            -scheme Maison \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Maison.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee build/archive.log | xcbeautify --renderer github-actions

      - name: Upload TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p build
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Maison.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log | xcbeautify --renderer github-actions

      - name: Journaux de distribution
        if: failure()
        run: find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' -exec cp -R {} build/ \; || true

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            build/*.log
            build/*.xcdistributionlogs
          if-no-files-found: ignore

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
