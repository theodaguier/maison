<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison</title>
  <meta name="description" content="Maison is a native iOS app for Home Assistant.">
  <!-- Home Assistant reads this to accept the app's sign-in callback (IndieAuth client_id page). -->
  <link rel="redirect_uri" href="maison://auth-callback">
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #000; --muted: rgba(60, 60, 67, .6); }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #fff; --muted: rgba(235, 235, 245, .6); } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: ui-rounded, -apple-system, system-ui, sans-serif; }
    main { padding: 24px; max-width: 420px; }
    h1 { font-size: 34px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 17px; line-height: 1.4; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Maison</h1>
    <p>A native iOS app for Home Assistant. This page lets your Home Assistant server recognise the app when you sign in.</p>
  </main>
</body>
</html>
